{% extends "base.html" %}
{% block conteudo %}
<h2>Registrar movimentação</h2>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
<form method="post">
  <label for="produto_id">Produto</label>
  <select id="produto_id" name="produto_id" required>
    <option value="">Escolha...</option>
    {% for p in produtos %}<option value="{{ p.id }}">{{ p.nome }} (saldo {{ p.saldo }})</option>{% endfor %}
  </select>
  <fieldset>
    <legend>Tipo</legend>
    <label><input type="radio" name="tipo" value="retirada" checked> Retirada</label>
    <label><input type="radio" name="tipo" value="entrada"> Entrada</label>
  </fieldset>
  <label for="quantidade">Quantidade</label>
  <input id="quantidade" name="quantidade" type="number" min="1" required>
  <button class="botao">Salvar</button>
  <a class="botao secundario" href="{{ url_for('estoque') }}">Voltar</a>
</form>

{% endblock %}
