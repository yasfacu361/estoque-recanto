{% extends "base.html" %}
{% block conteudo %}
<h2>Estoque</h2>
<a class="botao" href="{{ url_for('movimentar') }}">Registrar movimentação</a>
<a class="botao secundario" href="{{ url_for('novo_produto') }}">Novo produto</a>
<table>
  <tr><th>Produto</th><th>Saldo</th><th>Situação</th></tr>
  {% for p in produtos %}
  <tr>
    <td>{{ p.nome }}</td>
    <td>{{ p.saldo }}</td>
    <td>{% if p.repor %}<span class="repor">⚠ Repor</span>{% else %}OK{% endif %}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
