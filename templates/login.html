{% extends "base.html" %}
{% block conteudo %}
<div class="login-container">
  <section class="login-cartao cartao">
    <span class="login-icone" aria-hidden="true">✿</span>
    <span class="eyebrow">ESTOQUE DO RECANTO</span>
    <h2>Bem-vindo!</h2>
    <p class="ajuda">Entre para acompanhar e cuidar do estoque.</p>
    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
    <form method="post">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button class="botao login-botao">Entrar</button>
    </form>
  </section>
</div>
{% endblock %}
