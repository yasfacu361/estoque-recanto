{% extends "base.html" %}
{% block conteudo %}
<h2>Novo produto</h2>
{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post" class="cartao">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" maxlength="80" required>
  <label for="estoque_minimo">Quantidade minima</label>
  <input id="estoque_minimo" name="estoque_minimo" type="number" min="0" inputmode="numeric" required>
  <div class="acoes">
    <button class="botao">Salvar</button>
    <a class="botao secundario" href="{{ url_for('estoque') }}">Voltar</a>
  </div>
</form>
{% endblock %}
