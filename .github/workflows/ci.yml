name: CI

on:
  push:
    branches: [main, Desenvolvimento]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: estoque_recanto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: estoque_recanto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Criar tabelas
        run: mysql -h 127.0.0.1 -u root -proot < banco.sql
      - name: Rodar testes com cobertura
        run: pytest -v --cov=app --cov-report=term-missing
